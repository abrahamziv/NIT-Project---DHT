[project]
name = "ddms"
version = "0.1.0"
description = "Simulator for decentralized detection with many sensors (DDMS)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
